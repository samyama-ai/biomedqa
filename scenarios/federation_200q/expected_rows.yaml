# Expected rows — oracle for the 200-query large-scale federation suite
#
# Read by `load_oracle` in samyama-graph/examples/unified_benchmark.rs and applied
# by `classify(rows, oracle)`. One entry per query ID; a missing ID silently
# degrades to `non_empty`, which is the weakness this file exists to remove.
#
# status semantics (from `classify`):
#   exact          rows == `rows`                       -> pass, else fail_count
#   range          `min` <= rows <= `max`               -> pass, else fail_count
#                  (`min` defaults to 1, `max` to unbounded)
#   aggregation    any row count, including 0           -> pass
#   data_dependent any row count; 0 reports pass_data_gap
#   non_empty      rows > 0                             -> pass (the default)
#
# Conventions this file follows, in order of preference:
#
#  1. `exact` is used ONLY where the row count follows from Cypher semantics and
#     not from the data: a projection made entirely of aggregates with no grouping
#     key returns exactly one row whatever the store holds. No `exact` row count
#     here was invented from a guess at the data.
#  2. `range` max is the query's own LIMIT wherever it has one — that is a
#     semantic ceiling, not an estimate. Where a query has no LIMIT the max is a
#     deliberately wide bound on the grouping domain, or is omitted entirely so
#     only a floor is asserted.
#  3. `range` min for the 81 frozen queries is the row count MEASURED on the
#     2026-10-04 federation, which two independent runs reproduced identically.
#     For every added query min is 1 where the schema guarantees the pattern can
#     match, and 0 where an anchor literal or a threshold is unverified.
#  4. `data_dependent` is used where the query is schema-correct but the join has
#     no data — the 16 cross-vocabulary empties (samyama-graph #318) and the 3
#     that error — and for the two added queries that errored in every run they
#     have ever had.
#
# Every entry carries a `reason` saying what its numbers are based on. 119 of the
# 200 say UNEXECUTED: the 1.44B-edge federation needs a 743 GB box and none of the
# added queries has been run on it. See QUERY-SUITE.md.

